# Add to compose.local.yml

catalog-service:
  build:
    context: .
    dockerfile: services/catalog-service/Dockerfile
  ports:
    - "3002:3002"
  environment:
    PORT: 3002
    DATABASE_URL: postgresql://restaurant:restaurant@postgres:5432/catalog_db
    RABBITMQ_URL: amqp://restaurant:restaurant@rabbitmq:5672
    VALKEY_HOST: valkey
    VALKEY_PORT: 6379
    KEYCLOAK_JWKS_URI: http://keycloak:8080/realms/restaurant/protocol/openid-connect/certs
    NODE_ENV: development
  depends_on:
    postgres:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
    valkey:
      condition: service_healthy
  networks:
    - restaurant-network
  restart: unless-stopped
  healthcheck:
    test: [ "CMD", "wget", "-qO-", "http://localhost:3002/api/v1/health" ]
    interval: 30s
    timeout: 5s
    retries: 3
